services:
  - type: web
    name: jus-provas
    env: docker
    region: ohio
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: VITE_API_BASE
        value: /api
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
