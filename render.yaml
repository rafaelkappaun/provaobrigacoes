services:
  - type: web
    name: jus-obrigacoes-master
    env: docker
    region: ohio
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://jus-obrigacoes-master.onrender.com
      - key: VITE_API_BASE
        value: https://jus-obrigacoes-master.onrender.com/api
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
