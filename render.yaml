services:
  - type: web
    name: jus-obrigacoes-master
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://jus-obrigacoes-master.onrender.com
      - key: VITE_API_BASE
        value: https://jus-obrigacoes-master.onrender.com/api
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
