<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JUS OBRIGAÇÕES MASTER - Estudos Inteligentes</title>
    <script>
      window.addEventListener('error', function(e) {
        var isResource = e.target && (e.target.src || e.target.href);
        var errDiv = document.getElementById('error-overlay');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'error-overlay';
          errDiv.style.position = 'fixed';
          errDiv.style.top = '0';
          errDiv.style.left = '0';
          errDiv.style.width = '100%';
          errDiv.style.height = '100%';
          errDiv.style.backgroundColor = '#0b0f19';
          errDiv.style.color = '#ef4444';
          errDiv.style.padding = '24px';
          errDiv.style.zIndex = '999999';
          errDiv.style.fontFamily = 'system-ui, -apple-system, sans-serif';
          errDiv.style.overflow = 'auto';
          document.body.appendChild(errDiv);
        }
        if (isResource) {
          errDiv.innerHTML += '<div style="margin-bottom:20px;">' +
            '<h3 style="color:#fbbf24;font-size:18px;margin-bottom:8px;font-weight:bold;">⚠️ Falha ao Carregar Recurso</h3>' +
            '<p style="color:#e2e8f0;font-size:14px;">Não foi possível carregar o arquivo: <code style="background:#1e293b;padding:2px 6px;border-radius:4px;color:#f43f5e;font-family:monospace;font-size:12px;">' + (e.target.src || e.target.href) + '</code></p>' +
            '<p style="color:#94a3b8;font-size:13px;margin-top:10px;"><b>Dica:</b> O navegador do celular pode estar tentando acessar uma versão antiga do sistema armazenada no cache. Por favor, <b>limpe o cache do seu navegador</b> ou abra uma <b>nova guia anônima</b>.</p>' +
            '</div><hr style="border-color:#1e293b;margin:15px 0;">';
        } else {
          errDiv.innerHTML += '<div style="margin-bottom:20px;">' +
            '<h3 style="color:#f43f5e;font-size:18px;margin-bottom:8px;font-weight:bold;">❌ Erro de Execução</h3>' +
            '<p style="color:#e2e8f0;font-size:14px;"><strong>Mensagem:</strong> ' + e.message + '</p>' +
            '<p style="color:#e2e8f0;font-size:14px;"><strong>Origem:</strong> ' + e.filename + ':' + e.lineno + ':' + e.colno + '</p>' +
            '<pre style="background:#0f172a;padding:12px;border-radius:8px;border:1px solid rgba(244,63,94,0.3);color:#94a3b8;font-size:12px;white-space:pre-wrap;font-family:monospace;margin-top:8px;">' + (e.error && e.error.stack ? e.error.stack : 'Sem stack trace') + '</pre>' +
            '</div><hr style="border-color:#1e293b;margin:15px 0;">';
        }
      }, true);

      // Console virtual de depuração para celular
      (function() {
        var logs = [];
        function addLog(type, args) {
          var msg = Array.prototype.slice.call(args).map(function(arg) {
            try {
              return typeof arg === 'object' ? JSON.stringify(arg) : String(arg);
            } catch(e) { return '[Circular/Unserializable Object]'; }
          }).join(' ');
          
          // Aguarda o body carregar se necessário
          if (!document.body) {
            logs.push({type: type, msg: msg});
            return;
          }
          
          // Esvazia buffer inicial
          if (logs.length > 0) {
            logs.forEach(function(item) { renderLine(item.type, item.msg); });
            logs = [];
          }
          
          renderLine(type, msg);
        }

        function renderLine(type, msg) {
          var logBox = document.getElementById('debug-log-box');
          if (!logBox) {
            logBox = document.createElement('div');
            logBox.id = 'debug-log-box';
            logBox.style.position = 'fixed';
            logBox.style.bottom = '0';
            logBox.style.left = '0';
            logBox.style.width = '100%';
            logBox.style.maxHeight = '150px';
            logBox.style.backgroundColor = 'rgba(11, 15, 25, 0.95)';
            logBox.style.color = '#10b981';
            logBox.style.fontFamily = 'monospace';
            logBox.style.fontSize = '11px';
            logBox.style.overflow = 'auto';
            logBox.style.padding = '8px';
            logBox.style.zIndex = '9999999';
            logBox.style.borderTop = '2px solid #3b82f6';
            document.body.appendChild(logBox);
          }
          var line = document.createElement('div');
          line.style.borderBottom = '1px solid #1e293b';
          line.style.padding = '3px 0';
          line.style.whiteSpace = 'pre-wrap';
          var color = '#e2e8f0';
          if (type === 'ERROR') color = '#ef4444';
          if (type === 'WARN') color = '#fbbf24';
          line.style.color = color;
          line.innerText = '[' + type + '] ' + msg;
          logBox.appendChild(line);
          logBox.scrollTop = logBox.scrollHeight;
        }
        
        var _log = console.log;
        var _error = console.error;
        var _warn = console.warn;
        
        console.log = function() {
          addLog('LOG', arguments);
          _log.apply(console, arguments);
        };
        console.error = function() {
          addLog('ERROR', arguments);
          _error.apply(console, arguments);
        };
        console.warn = function() {
          addLog('WARN', arguments);
          _warn.apply(console, arguments);
        };

        window.addEventListener('DOMContentLoaded', function() {
          if (logs.length > 0) {
            logs.forEach(function(item) { renderLine(item.type, item.msg); });
            logs = [];
          }
        });
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-B_3MTodG.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DQd9EnAj.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
